name: Blog diario automático (ES/EN alternado)

on:
  schedule:
    - cron: '0 14 * * *'   # 8:00 am Torreón (UTC-6)
  workflow_dispatch:
    inputs:
      lang:
        description: 'Idioma (es | en). Vacío = alterna por día'
        required: false
      topic:
        description: 'Tema (opcional). Vacío = siguiente de _src/blog-topics.json'
        required: false

permissions:
  contents: write
  pages: write

concurrency:
  group: blog-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar artículo
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_LANG: ${{ github.event.inputs.lang }}
          BLOG_TOPIC: ${{ github.event.inputs.topic }}
        run: node scripts/blog_generate.mjs

      - name: Revisar enlaces internos
        run: python3 scripts/check_links.py

      - name: Commit y push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _src/ blog/ en/blog/ sitemap.xml
          if git diff --staged --quiet; then echo "Sin cambios"; echo "pushed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "blog: artículo diario ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main && git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Pedir build de GitHub Pages
        if: steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages se construye solo con el push"

      - name: IndexNow (tras el deploy)
        if: steps.push.outputs.pushed == '1'
        run: |
          sleep 120
          node scripts/indexnow.mjs --file _src/last-indexnow.json
